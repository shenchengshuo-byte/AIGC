<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>TOP100 链接采集</title><link rel="stylesheet" href="popup.css"><body><h1>TOP100 链接采集</h1><p>在你已登录的 TikTok 中读取可见搜索结果。89个剧名对应100条榜单记录。</p><div class="box"><strong id="progress">读取进度…</strong><p id="status"></p><p id="current"></p><small id="counts"></small></div><div class="buttons"><button id="start">开始 / 继续</button><button id="pause">暂停</button><button id="export">导出链接 JSON</button><button id="reset" class="secondary">重置进度</button></div><p class="note">使用独立标签页，运行时不要在该页手动跳转。每项读取后至少等待30秒；89项约需1小时以上。遇验证或连续两页无结果自动暂停。</p><p class="note">不读取密码、Cookie、登录令牌；不调用隐藏视频接口；不下载视频。数据仅存本机，不上传。结果仍是候选链接，需要核对作品和账号。</p><script src="popup.js"></script></body></html>
